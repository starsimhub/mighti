name: Run tests and build docs


on:
  push:
    branches: [main, upgrade-starsim322-stisim150]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install -r docs/requirements.txt
        # --- Ensure correct Starsim/STIsim versions (override cache) ---
        pip install --force-reinstall starsim==3.0.3 "STIsim>=1.5.0,<2"

    - name: Build package artifacts
      run: |
        pip install build
        python -m build

    - name: Install from built wheel
      run: |
        pip install --force-reinstall dist/*.whl
        pip install --force-reinstall starsim==3.0.3 "STIsim>=1.5.0,<2"
        python -c "import mighti; print(mighti.__version__)"

    - name: Run tests
      env:
        NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
        NUMBA_CACHE_LOCATOR_CLASSES: UserWideCacheLocator,IPythonCacheLocator
      run: |
        mkdir -p "$NUMBA_CACHE_DIR"
        pytest tests/

    - name: Build documentation
      run: |
        sphinx-build -b html docs docs/_build/html
        
